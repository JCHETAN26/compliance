[project]
name = "compliance-agents"
version = "0.1.0"
description = "LangGraph multi-agent review graph, agents, tools and versioned prompts"
requires-python = ">=3.11"
dependencies = ["compliance-core"]

[tool.uv.sources]
compliance-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_agents"]
