[project]
name = "compliance-ingestion"
version = "0.1.0"
description = "Parsers, OCR fallback and layout-aware chunking"
requires-python = ">=3.11"
dependencies = ["compliance-core"]

[tool.uv.sources]
compliance-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_ingestion"]
