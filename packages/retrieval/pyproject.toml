[project]
name = "compliance-retrieval"
version = "0.1.0"
description = "Hybrid (pgvector + full-text) retrieval with reciprocal rank fusion"
requires-python = ">=3.11"
dependencies = ["compliance-core"]

[tool.uv.sources]
compliance-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_retrieval"]
