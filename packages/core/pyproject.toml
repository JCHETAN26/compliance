[project]
name = "compliance-core"
version = "0.1.0"
description = "Shared configuration, database models, migrations, security primitives and service layer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "pyjwt>=2.10",
    "redis>=5.2,<6",
    "pgvector>=0.4",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_core"]
