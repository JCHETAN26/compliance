# Demo workspace manifest (make seed). Version-controlled configuration only: no raw
# dataset text lives here. Contract documents come from the ContractNLI TEST split
# (CC BY 4.0, see ml/data/LICENSES.md) and are generated at seed time into git-ignored
# locations. The vendor register values (data access level, renewal date) are SYNTHETIC
# demo data invented for the flagship scenario; they describe no real relationship.

dataset:
  name: ContractNLI
  url: https://stanfordnlp.github.io/contract-nli/resources/contract-nli.zip
  # Trust-on-first-use pin: computed from the archive downloaded on 2026-10-21
  # (65,362,913 bytes, Last-Modified 2022-02-11). The project does not publish a checksum.
  sha256: e03fc77bbf8b53e2976a250e81d8a294bc3d5e5fb014521e477dee9340d6287b
  max_bytes: 80000000
  split_file: contract-nli/test.json
  license: CC BY 4.0
  citation: Koreeda & Manning (2021), ContractNLI, Findings of EMNLP 2021

demo:
  email: demo@example.com
  password: demo1234  # mandated by docs/BUILD_HANDOFF.md section 13 (local demo only)
  workspace: Demo - Vendor confidentiality review
  register_filename: vendor_register.xlsx

# format: original_pdf = the dataset's original PDF (metadata stamped with provenance)
#         scanned_pdf  = the original PDF rasterised into an image-only PDF (no text layer)
#         docx         = the dataset's extracted text typeset as a Word document
