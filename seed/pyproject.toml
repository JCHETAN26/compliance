[project]
name = "compliance-seed"
version = "0.1.0"
description = "Reproducible demo workspace generator (vendor register + ContractNLI test-split NDAs)"
requires-python = ">=3.11"
dependencies = [
    "compliance-core",
    "compliance-ingestion",
    "pyyaml>=6.0",
]

[tool.uv.sources]
compliance-core = { workspace = true }
compliance-ingestion = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_seed"]
