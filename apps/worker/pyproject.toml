[project]
name = "compliance-worker"
version = "0.1.0"
description = "Background job worker (arq)"
requires-python = ">=3.11"
dependencies = [
    "compliance-core",
    "arq>=0.26",
    "compliance-ingestion",
    "compliance-seed",
]

[tool.uv.sources]
compliance-core = { workspace = true }
compliance-ingestion = { workspace = true }
compliance-seed = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_worker"]
