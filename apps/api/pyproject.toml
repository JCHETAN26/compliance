[project]
name = "compliance-api"
version = "0.1.0"
description = "REST + SSE backend API"
requires-python = ">=3.11"
dependencies = [
    "compliance-core",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "arq>=0.26",
    "compliance-retrieval",
]

[tool.uv.sources]
compliance-core = { workspace = true }
compliance-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_api"]
