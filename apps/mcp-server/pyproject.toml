[project]
name = "compliance-mcp-server"
version = "0.1.0"
description = "MCP server exposing workspace tools"
requires-python = ">=3.11"
dependencies = [
    "compliance-core",
    "mcp>=1.20",
    "uvicorn[standard]>=0.35",
]

[tool.uv.sources]
compliance-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_mcp_server"]
