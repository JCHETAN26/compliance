name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compliance
          POSTGRES_PASSWORD: compliance
          POSTGRES_DB: compliance_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U compliance -d compliance_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://compliance:compliance@127.0.0.1:55432/compliance_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Tesseract OCR (used by the OCR parser tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: uv sync --frozen
      - name: Cache pinned model + ContractNLI archive
        uses: actions/cache@v4
        with:
          path: .cache
          key: artifacts-${{ hashFiles('seed/src/compliance_seed/manifest.yaml', 'packages/core/src/compliance_core/config.py') }}
      - name: Fetch + verify artifacts (SHA-256 pinned)
        run: make fetch-artifacts
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (mypy --strict)
        run: uv run mypy packages apps conftest.py scripts evals ml
      - name: Tests (unit + integration against Postgres/pgvector + Redis)
        run: uv run pytest
      - name: ML unit tests (data, rule pack, metrics, sampling, accounting, notebook)
        run: uv run python -m pytest -q ml/tests
      - name: ML CPU smoke (tiny random backbone; data subset -> train -> eval -> ONNX -> service)
        # Pinned tool overlay (onnx, onnxscript, sentencepiece, anthropic): uv.lock and the
        # Docker dependency layer stay unchanged. No API calls; outputs are labelled SMOKE.
        run: uv run --frozen --with-requirements ml/requirements-tools.txt python -m pytest -q -p no:cacheprovider ml/smoke/tests

  web:
    name: Web (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Generated API types match the committed OpenAPI schema
        run: |
          npm run generate:api
          git diff --exit-code -- src/lib/api/schema.d.ts
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  stack:
    name: Docker build + compose smoke test
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Build images
        run: docker compose build
      - name: Start stack and wait for all healthchecks
        # Clean start: the worker downloads the pinned model + dataset into the
        # artifact-cache volume and seeds the demo workspace automatically.
        run: docker compose up -d --wait --wait-timeout 600
      - name: Service health
        run: docker compose ps
      - name: Wait for automatic demo seeding + ingestion (make seed is idempotent)
        run: docker compose exec -T worker python -m compliance_seed --wait 900
      - name: Phase 0 + Phase 1 + Phase 2 + Phase 3 smoke tests
        run: |
          uv sync --frozen
          uv run python scripts/smoke_phase0.py --web http://127.0.0.1:3000
          uv run python scripts/smoke_phase1.py --web http://127.0.0.1:3000
          uv run python scripts/smoke_phase2.py --web http://127.0.0.1:3000 --model-service http://127.0.0.1:8010
          uv run python scripts/smoke_phase3.py --web http://127.0.0.1:3000 --model-service http://127.0.0.1:8010
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
